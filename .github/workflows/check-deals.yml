name: Check for new deals

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-deals
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Poll every 20s for ~4.5 minutes, then hand off to the next scheduled run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_JBHIFI: ${{ secrets.DISCORD_WEBHOOK_URL_JBHIFI }}
          DISCORD_WEBHOOK_URL_DELTA_REIGN: ${{ secrets.DISCORD_WEBHOOK_URL_DELTA_REIGN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          END=$((SECONDS + 270))
          while [ $SECONDS -lt $END ]; do
            node src/check-and-post.js
            if ! git diff --quiet -- data/state.json; then
              git add data/state.json
              git commit -m "Update seen-deals state"
              git push
            fi
            sleep 20
          done
